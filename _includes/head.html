<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}{% if page.tagline %} | {{ page.tagline }}{% endif %}</title>
  {%- seo title=false -%}
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="icon" href="{{ "/assets/favicon.svg" | relative_url }}" type="image/svg+xml">
  <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"Person","name":{{ site.author | jsonify }},"jobTitle":"Backend engineer","url":{{ "/" | absolute_url | jsonify }},"sameAs":["https://github.com/{{ site.github_username }}","https://www.linkedin.com/in/{{ site.linkedin_username }}"]}
  </script>
  {%- assign en_url = "/" | absolute_url -%}
  <link rel="alternate" hreflang="en" href="{{ en_url }}">
  <link rel="alternate" hreflang="it" href="{{ "/it/" | absolute_url }}">
  <link rel="alternate" hreflang="x-default" href="{{ en_url }}">
</head>
